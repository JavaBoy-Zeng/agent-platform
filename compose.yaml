name: agentos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: "${AGENTOS_DATABASE_PASSWORD:-agentos}"
    ports:
      - "${AGENTOS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - database

  sandbox-docker:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --tls=false
    volumes:
      - sandbox-docker-data:/var/lib/docker
      - sandbox-tmp:/tmp
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - sandbox-control
      - runtime-egress

  runtime-images:
    image: docker:27-cli
    restart: "no"
    environment:
      DOCKER_HOST: tcp://sandbox-docker:2375
    entrypoint:
      - /bin/sh
      - -ec
      - |
        docker pull python:3.12-slim
        docker pull alpine:3.20
        docker pull eclipse-temurin:21-jdk-alpine
        docker pull node:22-alpine
        docker pull golang:1.25-alpine
    depends_on:
      sandbox-docker:
        condition: service_healthy
    networks:
      - sandbox-control
      - runtime-egress

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentos
      SPRING_DATASOURCE_USERNAME: agentos
      SPRING_DATASOURCE_PASSWORD: "${AGENTOS_DATABASE_PASSWORD:-agentos}"
      AGENTOS_PERSISTENCE_MODE: postgresql
      AGENTOS_CODE_EXECUTOR_ENABLED: "true"
      AGENTOS_CODE_EXECUTOR_MODE: docker
      AGENTOS_ALLOW_HOST_PROCESSES: "false"
      AGENTOS_RUN_COMMAND_ENABLED: "false"
      AGENTOS_FILE_ACCESS_ROOT: /workspace
      AGENTOS_ARTIFACTS_ROOT: /data/artifacts
      AGENTOS_SKILLS_ROOT: /data/skills
      AGENTOS_BROWSER_SEARCH_ENDPOINT: http://host.docker.internal:8888/search
      AGENTOS_MODEL_API_KEY: "${AGENTOS_MODEL_API_KEY:-}"
      AGENTOS_MODEL_ENDPOINT: "${AGENTOS_MODEL_ENDPOINT:-https://api.minimaxi.com/v1/chat/completions}"
      AGENTOS_MODEL_MODEL: "${AGENTOS_MODEL_MODEL:-MiniMax-M3}"
      AGENTOS_MODEL_CHAT_MODEL: "${AGENTOS_MODEL_CHAT_MODEL:-}"
      AGENTOS_MODEL_SECRET_KEY: "${AGENTOS_MODEL_SECRET_KEY:-qwKfaFJeiYG6CI6XSq7+jYoM1EH2wg/WHPPl5h84kv8=}"
      AGENTOS_API_KEY: "${AGENTOS_API_KEY:-}"
      AGENTOS_AUTH_ENABLED: "${AGENTOS_AUTH_ENABLED:-}"
      AGENTOS_AUTH_ADMIN_USER: "${AGENTOS_AUTH_ADMIN_USER:-admin}"
      AGENTOS_AUTH_ADMIN_PASSWORD: "${AGENTOS_AUTH_ADMIN_PASSWORD:-}"
      AGENTOS_AUTH_SECRET: "${AGENTOS_AUTH_SECRET:-}"
      DOCKER_HOST: tcp://sandbox-docker:2375
    ports:
      - "${AGENTOS_SERVER_PORT:-8080}:8080"
    volumes:
      - agentos-workspace:/workspace
      - agentos-artifacts:/data/artifacts
      - agentos-skills:/data/skills
      - sandbox-tmp:/tmp
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      runtime-images:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --header="X-API-Key: $${AGENTOS_API_KEY}" -O /dev/null http://127.0.0.1:8080/api/health'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app
      - database
      - sandbox-control

  console:
    build:
      context: agentos-console
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AGENTOS_WEB_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

volumes:
  postgres-data:
  sandbox-docker-data:
  sandbox-tmp:
  agentos-workspace:
  agentos-artifacts:
  agentos-skills:

networks:
  app:
  database:
    internal: true
  sandbox-control:
    internal: true
  runtime-egress:
