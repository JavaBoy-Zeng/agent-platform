# AgentOS 配置示例。
# 使用方式：复制为 application.yml，再按实际环境修改。
# 不要把真实 API Key 写入并提交到 Git。

server:
  port: 8080

spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/agentos}"
    username: "${SPRING_DATASOURCE_USERNAME:agentos}"
    password: "${SPRING_DATASOURCE_PASSWORD:agentos}"
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: "${SPRING_SQL_INIT_MODE:always}"
      schema-locations: classpath:db/schema-postgresql.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

agentos:
  persistence:
    # 正式运行使用 PostgreSQL；memory 仅用于测试。
    mode: "${AGENTOS_PERSISTENCE_MODE:postgresql}"
  cors:
    # 桌面壳（Tauri）等跨域客户端的来源白名单，逗号分隔；"*" 放行全部。
    # 默认已放行 tauri://localhost 与 http://tauri.localhost，无需额外配置。
    allowed-origins: "tauri://localhost,http://tauri.localhost"

  auth:
    # 多用户登录鉴权。总开关：显式 true/false 优先；留空时自动探测——
    # 配置了 admin-password 或用户库非空即启用，否则全放行（本地零配置开发）。
    enabled: "${AGENTOS_AUTH_ENABLED:}"
    # 首次启动引导：用户表为空时用以下账号创建 ADMIN；非空时忽略。生产必配密码。
    admin-user: "${AGENTOS_AUTH_ADMIN_USER:admin}"
    admin-password: "${AGENTOS_AUTH_ADMIN_PASSWORD:}"
    # JWT 签名密钥（≥32 字符随机串，openssl rand -hex 32 生成）；
    # 留空则每次启动随机生成——重启后所有登录失效。更换密钥 = 全端登出。
    secret: "${AGENTOS_AUTH_SECRET:}"
    # 登录令牌有效期；失败 5 次锁定 15 分钟。
    token-ttl: "30d"
    max-login-failures: 5
    lockout: "15m"
  runtime:
    # 全部入口共享的实际执行并发上限；超限快速返回 429。
    max-concurrent-runs: 128
    stream:
      # 流式/后台任务的执行槽位与等待队列均有界。
      max-concurrent-runs: 128
      queue-capacity: 256
    retention:
      # 仅保留最近的终态运行及每次运行最近的流式事件，防止堆内存无界增长。
      max-runs: 1000
      max-events-per-run: 2000
      max-invocations: 10000
      max-sessions: 5000
      max-events-per-invocation: 200
      max-events-per-session: 2000
    # 单次 Agent 运行的累计预算；工具重试也计入 max-tool-calls。
    max-replan-count: 3
    max-step-count: 30
    max-tool-calls: 30
    max-model-calls: 6
    # 复杂任务完成后会额外调用一次文本模型，并把上游 SSE 增量直接转发为 output_delta。
    # 该调用计入 max-model-calls；以下上限在流式过程中生效。
    max-final-answer-chars: 100000
    max-final-draft-chars: 32000
    # 仅将摘要后的工具结果反馈给模型，避免多轮规划持续放大上下文。
    max-observation-chars: 4000
    max-observation-total-chars: 24000

  router:
    # Supervisor 只有达到该置信度才直接派发专业 Agent；低置信度请求澄清或回退主 Agent。
    supervisor:
      min-confidence: ${AGENTOS_ROUTER_SUPERVISOR_MIN_CONFIDENCE:0.75}
    short-circuit:
      max-chars: 16
      greeting-message: "你好！有什么我可以帮你的吗？"
      acknowledgement-message: "好的。"
      thanks-message: "不客气！有需要随时告诉我。"
      farewell-message: "晚安，祝你好梦。"
    simple-qa:
      max-chars: 64

  model:
    # Provider API Key 的 AES-256-GCM 主密钥（openssl rand -base64 32），生产环境必配。
    secret-key: "${AGENTOS_MODEL_SECRET_KEY:}"
    # MiniMax 中国区 OpenAI-compatible 配置。
    model: "MiniMax-M3"
    api-key: "${AGENTOS_MODEL_API_KEY:}"
    endpoint: "https://api.minimaxi.com/v1/chat/completions"

    # MiniMax 当前不接收 OpenAI response_format 参数。
    response-format: "NONE"

    # 将 MiniMax-M3 的思考内容拆分到 reasoning_content，保持 content 为纯 JSON。
    reasoning-split: true

    connect-timeout: "10s"
    request-timeout: "60s"
    # 单次 Planner user prompt 的字符上限；超限时保留首尾关键上下文。
    max-prompt-chars: 60000

  memory:
    # 正式数据与运行态共用 PostgreSQL；memory 仅用于测试。
    mode: "${AGENTOS_MEMORY_MODE:postgresql}"
    processor:
      # rule 为零配置规则抽取；生产环境使用 openai 并配置独立记忆加工模型。
      mode: "rule"
      endpoint: "${AGENTOS_MEMORY_CHAT_ENDPOINT:}"
      api-key: "${AGENTOS_MEMORY_CHAT_API_KEY:}"
      model: "${AGENTOS_MEMORY_CHAT_MODEL:}"
      timeout: "60s"
    embedding:
      # hashing 仅适合本地开发；生产环境使用 openai，向量会按内容版本持久化。
      mode: "hashing"
      endpoint: "${AGENTOS_MEMORY_EMBEDDING_ENDPOINT:}"
      api-key: "${AGENTOS_MEMORY_EMBEDDING_API_KEY:}"
      model: "${AGENTOS_MEMORY_EMBEDDING_MODEL:}"
      timeout: "30s"

  security:
    # 兼容脚本/机器调用的固定密钥；为空时仅登录令牌可用。
    api-key: "${AGENTOS_API_KEY:}"
    # 保持 false 可禁止 Shell、Git 和本地代码执行绕过文件根目录。
    allow-host-processes: false
    identity:
      # 默认使用服务端固定身份，不信任调用方伪造的 team/user/role Header。
      team-id: "default-team"
      user-id: "default-user"
      roles: ""
      # 仅在可信 API Gateway 已完成身份认证和 Header 清洗时开启。
      trust-headers: false

  tools:
    file-access:
      # 所有内置文件工具的唯一允许根目录；会阻止 .. 和符号链接逃逸。
      # 根目录内的部署配置文件仍会被工具层隐藏，并拒绝读取和写入。
      root: "/Users/whale_fall/agentos"
    run-command:
      enabled: false
      work-dir: "/Users/whale_fall/agentos/work"
    code-executor:
      # 如需执行代码，建议改为 true + docker；不要在严格部署中使用 local。
      enabled: false
      mode: "docker"
    web-fetch:
      timeout-seconds: 20
      max-chars: 12000
    web-search:
      # SearchAgent 要求 web_search + web_fetch，并至少验证两个不同站点后才会完成。
      # 留空时不会注册 web_search，检索任务会明确失败，且不会让模型猜 URL。
      endpoint: "https://api.tavily.com/search"
      api-key: "${AGENTOS_WEB_SEARCH_API_KEY:}"
      timeout-seconds: 20
    browser-search:
      # 主要的网页浏览器搜索工具：SearXNG（Docker 镜像 searxng/searxng:latest）。
      # 需先部署 SearXNG 并在 settings.yml 中启用 JSON 输出格式（search.formats 含 json），
      # 否则调用会返回 HTTP 403；部署方式见 docker/searxng/。
      endpoint: "${AGENTOS_BROWSER_SEARCH_ENDPOINT:http://localhost:8888/search}"
      timeout-seconds: 20
    firecrawl:
      # 配置 API Key 后自动注册 web_crawl 与 web_map；自部署且未启用认证时可显式开启。
      enabled: false
      base-url: "${FIRECRAWL_API_URL:https://api.firecrawl.dev}"
      api-key: "${FIRECRAWL_API_KEY:}"
      request-timeout-seconds: 30
      crawl-timeout-seconds: 120
      poll-interval-millis: 1000
      # 限制模型单次调用可消耗的页面、链接和上下文规模。
      crawl-max-pages: 100
      crawl-max-output-chars: 40000
      map-max-links: 500
      map-max-output-chars: 30000

logging:
  level:
    root: INFO
    com.github.agentos: INFO

  # 同时写入控制台和滚动日志文件。
  file:
    name: "logs/agentos.log"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: 14
      total-size-cap: "200MB"

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
