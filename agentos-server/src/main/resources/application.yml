agentos:
  persistence:
    # 运行态持久化：memory（默认，零依赖）或 sqlite。
    # sqlite 模式下领域事件、审批 Checkpoint、断点续跑状态与用量账本
    # 写入同一 SQLite 文件，重启后审批恢复与账本查询仍可用。
    mode: "${AGENTOS_PERSISTENCE_MODE:memory}"
    sqlite-file: "${AGENTOS_PERSISTENCE_SQLITE_FILE:.agentos/runtime/runtime.sqlite}"
  security:
    # REST 接口鉴权密钥（X-API-Key 请求头）；留空关闭鉴权，便于本地开发。
    # 上线 run_command 等高危工具前必须配置。
    api-key: "${AGENTOS_API_KEY:}"
  tools:
    run-command:
      # 设为 false 可完全禁用 shell 执行工具。
      enabled: "${AGENTOS_RUN_COMMAND_ENABLED:true}"
      # 命令工作目录；默认服务进程当前目录。
      work-dir: "${AGENTOS_RUN_COMMAND_WORK_DIR:${user.dir}}"
      # 单条命令超时秒数。
      timeout-seconds: "${AGENTOS_RUN_COMMAND_TIMEOUT_SECONDS:60}"
      # 输出截断上限，防止 token 爆炸。
      max-output-chars: "${AGENTOS_RUN_COMMAND_MAX_OUTPUT_CHARS:20000}"
    web-fetch:
      # 单次抓取超时秒数。
      timeout-seconds: "${AGENTOS_WEB_FETCH_TIMEOUT_SECONDS:20}"
      # 正文截断上限。
      max-chars: "${AGENTOS_WEB_FETCH_MAX_CHARS:12000}"
    web-search:
      # Tavily API Key（https://tavily.com）；留空不注册 web_search 工具。
      api-key: "${AGENTOS_WEB_SEARCH_API_KEY:}"
      endpoint: "${AGENTOS_WEB_SEARCH_ENDPOINT:https://api.tavily.com/search}"
      timeout-seconds: "${AGENTOS_WEB_SEARCH_TIMEOUT_SECONDS:20}"
    code-executor:
      # 设为 false 可完全禁用 execute_code 工具。
      enabled: "${AGENTOS_CODE_EXECUTOR_ENABLED:true}"
      # 执行环境：auto（默认，Docker 可用走沙箱，否则回退本地进程）、
      # docker（强制沙箱）、local（宿主机直跑，HIGH 风险需审批）。
      mode: "${AGENTOS_CODE_EXECUTOR_MODE:auto}"
      # 默认执行超时秒数（工具参数可按次覆盖）。
      timeout-seconds: "${AGENTOS_CODE_EXECUTOR_TIMEOUT_SECONDS:60}"
      # 单流输出截断上限，防止 token 爆炸。
      max-output-chars: "${AGENTOS_CODE_EXECUTOR_MAX_OUTPUT_CHARS:20000}"
  skills:
    # 技能体系：load_skill 工具按需注入操作指南，正文不常驻提示词。
    enabled: "${AGENTOS_SKILLS_ENABLED:true}"
    # 本地技能目录（<root>/<技能名>/SKILL.md）；优先级高于 classpath，可覆盖内置技能。
    root: "${AGENTOS_SKILLS_ROOT:.agentos/skills}"
    # 内置 classpath 技能资源路径（逗号分隔）。
    classpath-resources: "skills/report-writing/SKILL.md,skills/code-review/SKILL.md"
  runtime:
    max-replan-count: 6
    max-step-count: 30
    max-tool-calls: 30
    max-model-calls: 10
    max-observation-chars: 4000
    max-observation-total-chars: 24000
  history:
    # 多轮上下文：运行前从事件存储回放的最近完整轮次数（用户+助手各算一行）。
    max-turns: 5
    # 历史中单条消息的截断上限，防止长输出拖爆 prompt。
    max-message-chars: 400
  artifacts:
    # Agent 运行产物（报告、文档等）的本地存储目录；
    # 工具写文件成功后自动登记，可经 /api/artifacts 查询与下载。
    root: "${AGENTOS_ARTIFACTS_ROOT:.agentos/artifacts}"
  router:
    short-circuit:
      # 触发短路的请求文本长度上限；0 表示关闭短路。
      # 严格白名单策略下白名单条目最长为 16 字符（"thank you"），默认值取 16 即可。
      max-chars: 16
      # 短路时直接返回的 canned answer，避免任何 LLM/工具调用。
      message: "收到，我已记录你的输入。"
    simple-qa:
      # 简单问答分级的文本长度上限；0 表示关闭该分级（全部走 MainAgent 规划）。
      # 命中后派发到 simple-qa-agent 单次直答，不携带工具定义、不进入规划循环；
      # 含任务信号词（查询/文件/天气等）的请求不受此长度影响，始终走复杂任务链路。
      max-chars: 64
  model:
    # 本地开发可以直接填写模型 ID；生产环境建议使用同名环境变量覆盖。
    model: "${AGENTOS_MODEL_MODEL:MiniMax-M3}"
    # 简单问答直答路径使用的模型；留空复用上面的主模型，可指定更小更快的模型。
    chat-model: "${AGENTOS_MODEL_CHAT_MODEL:}"
    # 不建议把真实 API Key 提交到 Git。
    api-key: "${AGENTOS_MODEL_API_KEY:}"
    endpoint: "${AGENTOS_MODEL_ENDPOINT:https://api.minimaxi.com/v1/chat/completions}"
    # MiniMax 当前的 OpenAI-compatible 接口不接收 response_format。
    response-format: "${AGENTOS_MODEL_RESPONSE_FORMAT:NONE}"
    # MiniMax-M3 将思考内容放入 reasoning_content，保持 content 为纯 JSON。
    reasoning-split: "${AGENTOS_MODEL_REASONING_SPLIT:true}"
    connect-timeout: "${AGENTOS_MODEL_CONNECT_TIMEOUT:10s}"
    request-timeout: "${AGENTOS_MODEL_REQUEST_TIMEOUT:600s}"
    max-prompt-chars: "${AGENTOS_MODEL_MAX_PROMPT_CHARS:60000}"

logging:
  level:
    com.github.agentos: INFO
