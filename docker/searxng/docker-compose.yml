# AgentOS 主要网页浏览器搜索服务：SearXNG 元搜索引擎。
# 启动：docker compose up -d
# 对应 agentos.tools.browser-search.endpoint = http://localhost:8888/search
services:
  searxng:
    image: searxng/searxng:latest
    container_name: agentos-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
